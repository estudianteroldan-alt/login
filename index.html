<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Login Form</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%236366f1'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white' font-family='system-ui,sans-serif'>L</text></svg>">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="company-logo">
                    <div class="logo-icon">🏢</div>
                </div>
                <h2>Bienvenido</h2>
                <p>Por favor introduzca su cuenta</p>
            </div>
            
            <form class="login-form" id="loginForm" >
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="email" id="email" name="email">
                        <label for="email">Cuenta Gmail</label>
                        <span class="input-border"></span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper password-wrapper">
                        <input type="password" id="password" name="password" >
                        <label for="password">Contraseña</label>
                        <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                            
                        </button>
                        <span class="input-border"></span>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <div class="form-options">
                    <div class="remember-wrapper">
                    </div>
                    <a href="#" class="forgot-password">Reset password</a>
                </div>

                <button type="submit" class="login-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader"></span>
                </button>
            </form>

            <div class="divider">
                <span>or sign in with</span>
            </div>

            <div class="sso-options">
                <button type="button" class="sso-btn azure-btn">
                    <span class="sso-icon azure-icon"></span>
                    <span>FACEBOOK</span>
                </button>
                <button type="button" class="sso-btn okta-btn">
                    <span class="sso-icon okta-icon"></span>
                    <span>Okta</span>
                </button>
            </div>
        </div>
    </div>

    
</body>
</html>
